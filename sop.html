creenshots with test or anonymised information and blank approved templates. Do not upload client records or personal data.</p><div class="resource"><div><strong>System screenshots</strong><small>Not added yet — upload approved images to the screenshots folder.</small></div><span class="status">Pending</span></div><div class="resource"><div><strong>Blank forms and templates</strong><small>Not added yet — upload approved files to the templates folder.</small></div><span class="status">Pending</span></div><p class="notice">When a file is uploaded, add a link to it here using its repository path.</p></section><section class="panel"><h2>8. FAQs and escalation</h2><p><strong>What if the case does not match this procedure?</strong><br>Pause and contact the relevant process owner or authorised department before proceeding.</p><p><strong>Who approves this SOP?</strong><br>To be assigned by the relevant department.</p></section><section class="panel"><h2>9. Document control</h2><div class="tablewrap"><table><tbody><tr><th>SOP owner</th><td>To be assigned</td></tr><tr><th>Approval status</th><td>Draft — pending approval</td></tr><tr><th>Last updated</th><td>10 November 2026 (starter content date)</td></tr><tr><th>Verified by</th><td>Not yet assigned</td></tr><tr><th>Next review</th><td>Set after approval</td></tr></tbody></table></div></section></div><aside class="side"><section class="panel"><h2>In this category</h2>${c.topics.map(x=>`<a href="${topicUrl(c,x)}">${esc(x.title)}</a>`).join('')}</section><section class="panel"><h2>Need help?</h2><p class="muted">If the SOP is incomplete, outdated or unclear, contact the assigned process owner. Do not assume an unverified requirement.</p><a href="${catUrl(c)}">← Back to ${esc(c.title)}</a><br><a href="index.html">← Knowledge Hub home</a></section></aside></div></main>`+footer();
