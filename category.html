<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knowledge Category | Meydan FZ</title><link rel="stylesheet" href="assets/style.css"><script src="assets/data.js"></script><script src="assets/app.js"></script></head><body><div id="app"></div><script>
const slug=new URLSearchParams(location.search).get('category');const c=KB_DATA.find(x=>x.slug===slug);const app=document.getElementById('app');
if(!c){app.innerHTML=header()+'<main class="wrap"><div class="panel">Category not found. <a href="index.html">Return home</a>.</div></main>'+footer()}else{document.title=c.title+' | Meydan FZ Knowledge Hub';app.innerHTML=header()+`<main class="wrap"><div class="crumb"><a href="index.html">Home</a> / ${esc(c.title)}</div><section class="pagehead"><div class="num">${c.number} / KNOWLEDGE AREA</div><h1>${esc(c.title)}</h1><p class="muted">${esc(c.intro)}</p><span class="pill">${c.topics.length} SOP topics</span></section><div class="section-head"><div><h2>Subtopics and SOPs</h2><div class="muted">Select a subtopic to open its full procedure.</div></div></div><section class="topiclist">${c.topics.map((t,i)=>`<a class="topic" href="${topicUrl(c,t)}"><div class="num">${String(i+1).padStart(2,'0')} / SOP</div><h3>${esc(t.title)} →</h3><p>${esc(t.summary)}</p></a>`).join('')}</section></main>`+footer()}
</script></body></html>
