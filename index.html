<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meydan FZ Employee Knowledge Hub</title><link rel="stylesheet" href="assets/style.css"><script src="assets/data.js"></script><script src="assets/app.js"></script></head><body><div id="app"></div><script>
document.getElementById('app').innerHTML=header()+`<main class="wrap"><section class="hero"><div class="eyebrow">Employee reference centre</div><h1>Meydan FZ Knowledge Hub</h1><p>Find approved procedures, document checklists, process steps and operational guidance in one place.</p>${searchMarkup()}</section><div class="section-head" id="topics"><div><h2>Knowledge categories</h2><div class="muted">Choose a topic to browse its SOPs and guidance.</div></div><span class="pill">7 main topics</span></div><section class="grid">${KB_DATA.map(c=>`<a class="card" href="${catUrl(c)}"><div class="num">${c.number} / KNOWLEDGE AREA</div><h3>${esc(c.title)}</h3><p>${esc(c.intro)}</p><p style="margin-top:12px;color:var(--teal);font-weight:700">${c.topics.length} subtopics →</p></a>`).join('')}</section><div class="panel" style="margin-top:22px"><h2>How to use this knowledge base</h2><ol><li>Choose a category or search for a keyword.</li><li>Open the relevant subtopic SOP.</li><li>Check the required documents, steps, process diagram and important notes.</li><li>Confirm approval status and last-reviewed date before relying on the information.</li></ol><div class="callout">Important: This is a starter knowledge-base framework. SOPs are marked Draft until reviewed and approved by the relevant process owner. Fees, timelines, authority requirements and internal contacts must be verified before use.</div></div></main>`+footer();
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});
</script></body></html>
